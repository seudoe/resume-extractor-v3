[project]
name = "rx3"
version = "0.1.0"
description = "LLM-free resume extraction pipeline (iFind resume-extractor-v3)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "rapidocr-onnxruntime>=1.3",
    "pytesseract>=0.3",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "dateparser>=1.2",
    "rapidfuzz>=3.10",
    "phonenumbers>=8.13",
    "ftfy>=6.3",
    "flashtext>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Stage 10's GLiNER2 extractor is deliberately NOT in `dependencies`: its
# runtime pulls in torch, which is a large download (see DECISIONS.md Stage 3)
# and isn't needed before Stage 10. Install with `uv sync --extra gliner`.
gliner = ["gliner2[local]"]  # CPU torch: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
# Stage 13 experiment only (RX3_ENABLE_SLM, off by default). Prebuilt wheel: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
slm = ["llama-cpp-python"]
dev = [
    "pytest>=8.3",
    "scipy>=1.14",
    "psutil>=6.1",
    "jiwer>=3.0",
    "pandas>=2.2",
    "jinja2>=3.1",
    "hypothesis>=6.100",
    "reportlab>=4.2",
    "playwright>=1.48",
    "ruff>=0.7",
]
# CUDA torch (~2.5 GB) and the other fine-tuning deps: only installed after
# an explicit user go-ahead (PROMPT.md Stage 3 Checkpoint 3A). Install with
# `uv sync --extra train`.
train = [
    "torch",
    "gliner2[train]",
    "transformers>=4.46",
    "datasets>=3.1",
    "peft>=0.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rx3"]
